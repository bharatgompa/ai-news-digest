settings:
  lookback_hours: 26        # a little over a day, so a late cron run doesn't miss items
  max_items_per_feed: 12    # keeps busy news feeds from crowding out the rest
  max_items_total: 250      # hard cap on what we send to the LLM
  digest_size: 25           # how many stories end up in the digest

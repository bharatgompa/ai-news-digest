# What the agent reads every day. Add/remove freely — a broken feed is skipped, not fatal,
# and the digest's "failed_sources" field tells you which ones broke.
#
# YouTube: every channel has a free RSS feed. To find a channel_id, open the channel page,
# View Page Source, and search for "channel_id" (or "externalId"). It looks like UCxxxxxxxxxxxxxxxxxxxxxx.

interests: |
  The reader is a ~4 YOE backend engineer from Andhra Pradesh/Telangana, working in India (Java, Kafka,
  GCP, C++, fintech). They are preparing to switch to a product company and moving towards
  AI-engineer / Forward Deployed Engineer roles. They want this digest to replace reading several
  newspapers: a well-rounded picture of the last 24 hours, across the globe.

  They care about:
  - AI: major model launches, agent frameworks, AI tooling, AI's effect on jobs and hiring.
  - Tech & engineering: big tech news, backend/distributed systems, notable engineering write-ups and outages.
  - Tech industry & jobs: layoffs, hiring trends, funding, Indian startup and IT-services news.
  - India: national politics, policy, government decisions, courts, and major events.
    Give extra weight to Andhra Pradesh and Telangana news.
  - World: geopolitics, wars and conflicts, elections, trade, climate and natural disasters.
  - Markets & money (they are a long-term SIP / index-fund investor): RBI policy, inflation, big
    Nifty/Sensex moves and why, tax/PF/mutual-fund rule changes, personal-finance news.
  - IPOs: upcoming and ongoing IPOs with factual details (dates, price band, size, subscription status,
    listing performance). Report facts only — no "should you apply" verdicts or grey-market hype.
  - Cricket: Indian team results and squads, major series and tournaments (international and IPL).

  Skip: celebrity/entertainment gossip, clickbait, day-trading tips, individual stock "buy" calls,
  crypto shilling, minor product updates, and duplicated coverage of the same story.


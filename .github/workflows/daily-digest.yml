name: Daily digest

on:
  schedule:
    - cron: "17 1 * * *"   # 01:17 UTC = 06:47 IST, every day
  workflow_dispatch:        # "Run workflow" button for manual runs

permissions:
  contents: write           # to commit the new digest JSON

concurrency:
  group: daily-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Build and send digest
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DASHBOARD_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: python -m digest

      - name: Commit digest to repo (publishes it on GitHub Pages)
        run: |
          git config user.name "digest-bot"
          git config user.email "digest-bot@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet || git commit -m "digest: $(date -u +%F)"
          git push
